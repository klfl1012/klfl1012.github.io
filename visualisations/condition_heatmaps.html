<style>
.street-toggle-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 10px 0 2px;
    background: white;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #344054;
}
.street-label { transition: color 0.2s; }
.street-label.active   { color: #1f2d2e; }
.street-label.inactive { color: #aab0bb; }

.switch { position: relative; display: inline-block; width: 48px; height: 26px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
    position: absolute; inset: 0;
    background: #1f2d2e;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s;
}
.slider:before {
    content: "";
    position: absolute;
    width: 20px; height: 20px;
    left: 3px; top: 3px;
    background: white;
    border-radius: 50%;
    transition: transform 0.2s;
}
.switch input:checked + .slider:before { transform: translateX(22px); }
</style>

<div class="street-toggle-wrap">
  <span class="street-label active"   id="lbl-top">Top 15 streets</span>
  <label class="switch">
    <input type="checkbox" id="street-switch" onchange="onStreetToggle(this)">
    <span class="slider"></span>
  </label>
  <span class="street-label inactive" id="lbl-all">All streets</span>
</div>

function onStreetToggle(cb) {
    const scope = cb.checked ? 'All' : 'Top 15';
    document.getElementById('lbl-top').className =
        'street-label ' + (cb.checked ? 'inactive' : 'active');
    document.getElementById('lbl-all').className =
        'street-label ' + (cb.checked ? 'active'   : 'inactive');
    updatePlot(scope);
}

function updatePlot(scope) {
    const gd = document.querySelector('.plotly-graph-div');
    const d  = HM_DATA[scope];

    Plotly.restyle(gd, {
        z:    d.map(p => p.z),
        x:    d.map(p => p.x),
        y:    d.map(p => p.y),
        text: d.map(p => p.text),
    }, [0, 1, 2]);
}
