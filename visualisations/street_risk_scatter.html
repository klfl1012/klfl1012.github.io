const ALL_GROUPS     = ["AVE", "BLVD", "DR", "OTHER", "PL", "RD", "ST"];
const GLOBAL_OPACITY = 0.8;

function switchGroup(grp) {
    document.querySelectorAll('#group-toggle button').forEach(b => {
        b.classList.toggle('active', b.textContent === grp);
    });

    const points = SCATTER_DATA[grp].points;
    const gd     = document.querySelector('.plotly-graph-div');

    const byGroup = {};
    ALL_GROUPS.forEach(g => byGroup[g] = {
        x: [], y: [], text: [], size: [], color: [], customdata: []
    });

    const labelX = [], labelY = [], labelText = [];
    let allX = [], allY = [];

    points.forEach(p => {
        const g = byGroup[p.group] || byGroup[ALL_GROUPS[ALL_GROUPS.length - 1]];
        if (!g) return;
        g.x.push(p.x);
        g.y.push(p.y);
        g.text.push(p.name);
        g.size.push(p.size);
        g.color.push(p.color);
        g.customdata.push([p.fatal, p.severe, p.y]);
        allX.push(p.x);
        allY.push(p.y);
        if (p.label) {
            labelX.push(p.x);
            labelY.push(p.y);
            labelText.push(p.name.replace(/\w\S*/g, t =>
                t.charAt(0).toUpperCase() + t.slice(1).toLowerCase()));
        }
    });

    ALL_GROUPS.forEach((g, i) => {
        const d = byGroup[g];
        Plotly.restyle(gd, {
            x:               [d.x],
            y:               [d.y],
            text:            [d.text],
            'marker.size':   [d.size],
            'marker.color':  [d.color],
            customdata:      [d.customdata],
        }, [i]);
    });

    // label trace
    const labelIdx = ALL_GROUPS.length;
    Plotly.restyle(gd, {
        x:    [labelX],
        y:    [labelY],
        text: [labelText],
    }, [labelIdx]);

    // ── refit axes to the new group's data range ──────────────────────────
    if (allX.length > 0) {
        const xMin = Math.min(...allX);
        const xMax = Math.max(...allX);
        const yMin = Math.min(...allY);
        const yMax = Math.max(...allY);
        const xPad = (xMax - xMin) * 0.08 || 500;
        const yPad = (yMax - yMin) * 0.12 || 1;

        Plotly.relayout(gd, {
            'xaxis.range':     [Math.max(0, xMin - xPad), xMax + xPad],
            'xaxis.autorange': false,
            'yaxis.range':     [Math.max(0, yMin - yPad), yMax + yPad],
            'yaxis.autorange': false,
        });
    }
}
